#
# Alle Tests bei jedem Push und Pull Request (inkl. Browser-Test und Versionsabgleich).
name: Tests

on:
  push:
    branches: [main, ccr-aacc267d-zkqp1r]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Versionsangaben prüfen
        run: python3 scripts/version.py
      - name: Syntax für die älteste unterstützte Python-Version (requires-python)
        run: uv run --no-project --python 3.10 python -m compileall -q skf
      - name: Abhängigkeiten (genau nach uv.lock)
        run: |
          uv sync --frozen --extra test
          uv run playwright install --with-deps chromium
      - name: Tests
        run: uv run pytest -q
