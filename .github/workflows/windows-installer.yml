#
# Baut und testet die Windows-Pakete (gratis: GitHub Actions, Inno Setup, Windows SDK):
#   Klassenbildung-Setup-<Version>.exe  – Installationsprogramm zum Herunterladen
#   Klassenbildung-<Version>.msix       – Paket für den Microsoft Store (der Store signiert es)
# Ergebnis: Artefakt "Klassenbildung-Windows" am Lauf. Release: "Run workflow" mit
# "release" (setzt Tag vX.Y.Z aus skf/version.py) oder ein gepushter Tag vX.Y.Z – beides
# erzeugt einen Release-Entwurf mit den Paketen und dem Changelog-Abschnitt.
# Store-Identität aus dem Partner Center als Repository-Variablen: MSIX_NAME, MSIX_PUBLISHER,
# MSIX_PUBLISHER_NAME (Settings → Secrets and variables → Actions → Variables).
name: Windows-Installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release-Entwurf mit Tag vX.Y.Z (aus skf/version.py) anlegen"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    branches: [main, ccr-aacc267d-zkqp1r]
    paths:
      - "skf/**"
      - "beispiele/vorlage/**"
      - "beispiele/malters/schule.yaml"
      - "beispiele/malters/kinder.csv"
      - "installer/**"
      - "scripts/lizenzen.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      MSIX_NAME: ${{ vars.MSIX_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Installer bauen
        shell: pwsh
        run: ./installer/windows/baue.ps1

      - name: Installer testen (still installieren, rechnen, App starten)
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/build/ausgabe/*Setup*.exe | Select-Object -First 1
          $ziel = Join-Path $env:RUNNER_TEMP "Klassenbildung"
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$ziel"
          $py = Join-Path $ziel "python\python.exe"
          $exe = Join-Path $ziel "Klassenbildung.exe"
          if (-not (Test-Path $exe)) { throw "Installation fehlt: $exe" }
          # Rechnen mit der mitgelieferten Vorlage – über den Starter, ohne Internet, ohne Quellcode
          Set-Location $env:RUNNER_TEMP
          $vorlage = (& $py -c "from skf.daten import beispiel_ordner; print(beispiel_ordner() / 'vorlage')").Trim()
          & $exe rechnen "$vorlage\schule.yaml" "$vorlage\kinder.csv" -o "$env:RUNNER_TEMP\ausgabe" -t 30
          if ($LASTEXITCODE) { throw "Rechnen fehlgeschlagen" }
          if (-not (Test-Path "$env:RUNNER_TEMP\ausgabe\bericht.html")) { throw "Bericht fehlt" }
          # Bedienoberfläche über den Starter starten und abfragen
          $app = Start-Process -FilePath $exe -ArgumentList "--ohne-browser" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://localhost:8501/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch {}
          }
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Bedienoberfläche antwortet nicht" }
          # Deinstallation
          Start-Process -Wait -FilePath (Join-Path $ziel "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          foreach ($i in 1..30) { if (-not (Test-Path $py)) { break }; Start-Sleep -Seconds 2 }
          if (Test-Path $py) { throw "Deinstallation unvollständig" }
          "Installer-Test bestanden"

      - name: MSIX testen (mit Test-Zertifikat signieren, installieren, starten, entfernen)
        shell: pwsh
        run: |
          $msix = Get-ChildItem installer/build/ausgabe/*.msix | Select-Object -First 1
          $test = Join-Path $env:RUNNER_TEMP "test.msix"
          Copy-Item $msix.FullName $test
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { "CN=Outthinkx for Communities" }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "test.pfx"
          $pw = ConvertTo-SecureString -String "nur-test" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p nur-test $test
          if ($LASTEXITCODE) { throw "Signieren fehlgeschlagen" }
          Add-AppxPackage -Path $test
          $paket = Get-AppxPackage | Where-Object { $_.Name -like "*Klassenbildung*" } | Select-Object -First 1
          if (-not $paket) { throw "MSIX nicht installiert" }
          "Installiert: $($paket.PackageFullName)"
          Start-Process "shell:AppsFolder\$($paket.PackageFamilyName)!Klassenbildung"
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://localhost:8501/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch {}
          }
          Get-Process python, Klassenbildung -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-AppxPackage -Package $paket.PackageFullName
          if (-not $ok) { throw "Bedienoberfläche aus dem MSIX antwortet nicht" }
          "MSIX-Test bestanden"

      - uses: actions/upload-artifact@v4
        with:
          name: Klassenbildung-Windows
          path: |
            installer/build/ausgabe/*.exe
            installer/build/ausgabe/*.msix
          retention-days: 30

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path skf/version.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          $release = "${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}" -eq "true"
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Release-Notizen aus dem CHANGELOG
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|^\[)")
          if (-not $m.Success) { throw "CHANGELOG.md hat keinen Abschnitt für $v" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notizen.md", $m.Groups[1].Value.Trim())

      - name: Release-Entwurf
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Klassenbildung & Stundenplan v${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notizen.md
          files: |
            installer/build/ausgabe/*.exe
            installer/build/ausgabe/*.msix
