# Beispiel: Kindergarten und Primarschule Malters (LU)
#
# Standorte nach öffentlichen Angaben (Schuljahr 2025/26): Primarschulhäuser
# Bündtmättli und Eischachen (je 4 Kindergärten), Wald-Kindergarten "Im Feld".
# Koordinaten, Raumzahlen, Lehrpersonen und Stundentafel sind ANNAHMEN für das
# Beispiel – bitte mit den echten Daten der Schule ersetzen.

name: Schule Malters – Volksschule (Beispiel)
schuljahr: 2027/28
basis_profil: luzern          # Kantonsprofil: Klassengrössen, Blockzeiten, IF/DaZ, Schulweg – mit Quellen
profil:
  verbindlich: true           # Klassengrössen gemäss VBV § 7 als harte Grenzen
# Oberstufe: S1A = 1. Sek Niveau A usw. – Stufenfolge für Übertritte: KG1 → KG2 → 1 … 6 → S1A/S1B/S1C → S2 → S3
jahrgaenge: [KG1, KG2, "1", "2", "3", "4", "5", "6", S1A, S1B, S1C, S2A, S2B, S2C, S3A, S3B, S3C]

schulhaeuser:
  - name: Bündtmättli
    kuerzel: BM
    stufen: KG1-6             # welche Stufen hier zur Schule gehen
    lat: 47.0338
    lon: 8.1862
    raeume:
      - {name: BM-Zi, typ: Klassenzimmer, anzahl: 13, plaetze: 25}
      - {name: BM-KG, typ: Kindergarten, anzahl: 4, plaetze: 22}
      - {name: BM-Halle, typ: Turnhalle, anzahl: 2, plaetze: 30, nicht_verfuegbar: [Fr-NM]}  # Vereinssport
      - {name: BM-TTG, typ: TTG-Zimmer, anzahl: 2, plaetze: 24}
  - name: Eischachen
    kuerzel: EI
    stufen: KG1-6             # welche Stufen hier zur Schule gehen
    lat: 47.0402
    lon: 8.1765
    raeume:
      - {name: EI-Zi, typ: Klassenzimmer, anzahl: 11, plaetze: 25}
      - {name: EI-KG, typ: Kindergarten, anzahl: 4, plaetze: 22}
      - {name: EI-Halle, typ: Turnhalle, anzahl: 2, plaetze: 30}
      - {name: EI-TTG, typ: TTG-Zimmer, plaetze: 24}
  - name: Im Feld
    kuerzel: IF
    stufen: KG1-KG2             # welche Stufen hier zur Schule gehen
    lat: 47.0445
    lon: 8.1880
    raeume:
      - {name: Waldplatz, typ: Wald, plaetze: 20}
    nicht_verfuegbar: [Mo-NM, Di-NM, Do-NM, Fr-NM]   # Wald-KG nur vormittags
  - name: Oberstufe            # ANNAHME: Sekundarschule (Lage, Name und Räume fiktiv)
    kuerzel: OS
    stufen: S1-S3             # welche Stufen hier zur Schule gehen
    lat: 47.0372
    lon: 8.1838
    raeume:
      - {name: OS-Zi, typ: Klassenzimmer, anzahl: 16, plaetze: 25}
      - {name: OS-Halle, typ: Turnhalle, anzahl: 2, plaetze: 30}
      - {name: OS-TTG, typ: TTG-Zimmer, anzahl: 2, plaetze: 24}

# Optional: Schulbus für den Weiler Blatten. Buskinder kommen nur in angefahrene Schulhäuser;
# ihr Unterricht beginnt nach der Ankunft und endet passend zu einer Abfahrt (max. Wartezeit).
schulbus:
  wartezeit_max: 15          # Minuten
  linien:
    - name: Schulbus Blatten
      schulhaeuser: [Bündtmättli, Oberstufe]
      ankunft: {VM: "07:50", NM: "13:20"}
      abfahrt: {VM: "11:40", NM: ["14:25", "15:15"]}   # zwei Kurse am Nachmittag

# Optional: Wegzeiten der Lehrpersonen zwischen Schulhäusern. Unterricht in zwei
# Schulhäusern direkt nacheinander nur, wenn die Pause reicht (sonst aus Koordinaten).
wegzeiten:
  geschwindigkeit_kmh: 15    # Velo
  minuten: {Bündtmättli-Eischachen: 10}

klassenbildung:
  geschwister: weich         # weich | hart | aus
  umweg_faktor: 1.3          # Luftlinie x 1.3 ≈ Fussweg
  max_schulweg_m: {KG1: 4000, KG2: 4000, default: 6000}
  vorlagen:                  # erlaubte Klassentypen
    - {jahrgaenge: [KG1, KG2], bezeichnung: KG, raumtyp: Kindergarten, min: 14, max: 22, ideal: 19}
    - {jahrgaenge: [KG1, KG2], bezeichnung: Wald-KG, raumtyp: Wald, min: 16, max: 20, ideal: 18}
    - {jahrgaenge: ["1"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["2"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["3"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["4"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["5"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["6"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["1", "2"], min: 16, max: 22, ideal: 20, strafe: 150}   # Mehrjahrgangsklassen (AdL)
    - {jahrgaenge: ["3", "4"], min: 16, max: 22, ideal: 20, strafe: 150}
    - {jahrgaenge: ["5", "6"], min: 16, max: 22, ideal: 20, strafe: 150}
    # Oberstufe (kooperatives Modell): Stammklassen je Niveau; kleine Jahrgänge können B/C kombinieren
    - {jahrgaenge: [S1A], min: 16, max: 24, ideal: 21}
    - {jahrgaenge: [S1B], min: 16, max: 24, ideal: 21}
    - {jahrgaenge: [S1C], min: 10, max: 18, ideal: 15}
    - {jahrgaenge: [S1B, S1C], min: 12, max: 20, ideal: 18, strafe: 150, min_pro_jahrgang: 4}
    - {jahrgaenge: [S2A], min: 16, max: 24, ideal: 21}
    - {jahrgaenge: [S2B], min: 16, max: 24, ideal: 21}
    - {jahrgaenge: [S2C], min: 10, max: 18, ideal: 15}
    - {jahrgaenge: [S2B, S2C], min: 12, max: 20, ideal: 18, strafe: 150, min_pro_jahrgang: 4}
    - {jahrgaenge: [S3A], min: 16, max: 24, ideal: 21}
    - {jahrgaenge: [S3B], min: 16, max: 24, ideal: 21}
    - {jahrgaenge: [S3C], min: 10, max: 18, ideal: 15}
    - {jahrgaenge: [S3B, S3C], min: 12, max: 20, ideal: 18, strafe: 150, min_pro_jahrgang: 4}

sonderpaedagogik:            # IF/DaZ-Angebote kommen aus dem Kantonsprofil (skf/profile/luzern.yaml)
  is_zaehlt_als: 2           # schulinterne Festlegung: IS-Kind zählt bei der Klassengrösse doppelt
  max_is_pro_klasse: 2

zeitraster:
  tage: [Mo, Di, Mi, Do, Fr]
  halbtage:
    VM: ["08:00", "08:50", "09:55", "10:45"]
    NM: ["13:30", "14:20"]
  frei: [Mi-NM]
  blockzeiten: true          # Vormittage lückenlos (VBV § 3 Abs. 4)

faecher:
  Deutsch: {max_pro_tag: 2}
  Mathematik: {max_pro_tag: 2}
  NMG: {max_pro_tag: 2}
  Englisch: {max_pro_tag: 1}
  Französisch: {max_pro_tag: 1}
  BG: {max_pro_tag: 2}
  Musik: {max_pro_tag: 1}
  TTG: {raumtyp: TTG-Zimmer, dauer: 2}
  Bewegung und Sport: {raumtyp: Turnhalle, max_pro_tag: 1}
  Kindergarten: {raumtyp: Klassenzimmer, max_pro_tag: 6}
  Wald: {raumtyp: Klassenzimmer, max_pro_tag: 6}
  NT: {max_pro_tag: 2}                     # Natur und Technik (Oberstufe)
  RZG: {max_pro_tag: 2}                    # Räume, Zeiten, Gesellschaften
  Berufliche Orientierung: {max_pro_tag: 1}

# Lektionen pro Woche – vereinfachte ANNAHME; verbindlich ist die WOST 2017 (Quelle "WOST" im Profil)
stundentafel:
  KG:      {Kindergarten: 20, Bewegung und Sport: 2}
  Wald-KG: {Wald: 20}
  "1": {Deutsch: 6, Mathematik: 5, NMG: 3, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "2": {Deutsch: 6, Mathematik: 5, NMG: 4, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "3": {Deutsch: 6, Mathematik: 5, NMG: 4, Englisch: 2, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "4": {Deutsch: 5, Mathematik: 5, NMG: 5, Englisch: 2, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "5": {Deutsch: 5, Mathematik: 5, NMG: 5, Englisch: 2, Französisch: 3, BG: 2, TTG: 2, Musik: 1, Bewegung und Sport: 3}
  "6": {Deutsch: 5, Mathematik: 5, NMG: 5, Englisch: 2, Französisch: 3, BG: 2, TTG: 2, Musik: 1, Bewegung und Sport: 3}
  # Oberstufe: gilt für alle Niveaus (eigene Tafel je Niveau möglich, z.B. "S1C"). Gekürzt auf die
  # 28 Zeitfenster des Beispielrasters – die echte WOST-Sek-Tafel hat mehr Lektionen (dritte NM-Lektion).
  S1: {Deutsch: 4, Französisch: 3, Englisch: 3, Mathematik: 5, NT: 3, RZG: 3, BG: 2, TTG: 2, Bewegung und Sport: 2}
  S2: {Deutsch: 4, Französisch: 3, Englisch: 3, Mathematik: 5, NT: 3, RZG: 3, BG: 2, TTG: 2, Bewegung und Sport: 2}
  S3: {Deutsch: 4, Französisch: 3, Englisch: 3, Mathematik: 5, NT: 3, RZG: 2, Berufliche Orientierung: 1, BG: 2, TTG: 2, Bewegung und Sport: 2}

