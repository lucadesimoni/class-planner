# Beispiel: Kindergarten und Primarschule Malters (LU)
#
# Standorte nach öffentlichen Angaben (Schuljahr 2025/26): Primarschulhäuser
# Bündtmättli und Eischachen (je 4 Kindergärten), Wald-Kindergarten "Im Feld".
# Koordinaten, Raumzahlen, Lehrpersonen und Stundentafel sind ANNAHMEN für das
# Beispiel – bitte mit den echten Daten der Schule ersetzen.

name: Schule Malters – Kindergarten & Primar (Beispiel)
schuljahr: 2027/28
basis_profil: luzern          # Kantonsprofil: Klassengrössen, Blockzeiten, IF/DaZ, Schulweg – mit Quellen
profil:
  verbindlich: true           # Klassengrössen gemäss VBV § 7 als harte Grenzen
jahrgaenge: [KG1, KG2, "1", "2", "3", "4", "5", "6"]

schulhaeuser:
  - name: Bündtmättli
    kuerzel: BM
    lat: 47.0338
    lon: 8.1862
    raeume:
      - {name: BM-Zi, typ: Klassenzimmer, anzahl: 13, plaetze: 25}
      - {name: BM-KG, typ: Kindergarten, anzahl: 4, plaetze: 22}
      - {name: BM-Halle, typ: Turnhalle, anzahl: 2, plaetze: 30, nicht_verfuegbar: [Fr-NM]}  # Vereinssport
      - {name: BM-TTG, typ: TTG-Zimmer, anzahl: 2, plaetze: 24}
  - name: Eischachen
    kuerzel: EI
    lat: 47.0402
    lon: 8.1765
    raeume:
      - {name: EI-Zi, typ: Klassenzimmer, anzahl: 11, plaetze: 25}
      - {name: EI-KG, typ: Kindergarten, anzahl: 4, plaetze: 22}
      - {name: EI-Halle, typ: Turnhalle, anzahl: 2, plaetze: 30}
      - {name: EI-TTG, typ: TTG-Zimmer, plaetze: 24}
  - name: Im Feld
    kuerzel: IF
    lat: 47.0445
    lon: 8.1880
    raeume:
      - {name: Waldplatz, typ: Wald, plaetze: 20}
    nicht_verfuegbar: [Mo-NM, Di-NM, Do-NM, Fr-NM]   # Wald-KG nur vormittags

# Optional: Schulbus für den Weiler Blatten. Buskinder kommen nur in angefahrene Schulhäuser;
# ihr Unterricht beginnt nach der Ankunft und endet passend zu einer Abfahrt (max. Wartezeit).
schulbus:
  wartezeit_max: 15          # Minuten
  linien:
    - name: Schulbus Blatten
      schulhaeuser: [Bündtmättli]
      ankunft: {VM: "07:50", NM: "13:20"}
      abfahrt: {VM: "11:40", NM: ["14:25", "15:15"]}   # zwei Kurse am Nachmittag

# Optional: Wegzeiten der Lehrpersonen zwischen Schulhäusern. Unterricht in zwei
# Schulhäusern direkt nacheinander nur, wenn die Pause reicht (sonst aus Koordinaten).
wegzeiten:
  geschwindigkeit_kmh: 15    # Velo
  minuten: {Bündtmättli-Eischachen: 10}

klassenbildung:
  geschwister: weich         # weich | hart | aus
  umweg_faktor: 1.3          # Luftlinie x 1.3 ≈ Fussweg
  max_schulweg_m: {KG1: 4000, KG2: 4000, default: 6000}
  vorlagen:                  # erlaubte Klassentypen
    - {jahrgaenge: [KG1, KG2], bezeichnung: KG, raumtyp: Kindergarten, min: 14, max: 22, ideal: 19}
    - {jahrgaenge: [KG1, KG2], bezeichnung: Wald-KG, raumtyp: Wald, min: 16, max: 20, ideal: 18}
    - {jahrgaenge: ["1"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["2"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["3"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["4"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["5"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["6"], min: 16, max: 22, ideal: 20}
    - {jahrgaenge: ["1", "2"], min: 16, max: 22, ideal: 20, strafe: 150}   # Mehrjahrgangsklassen (AdL)
    - {jahrgaenge: ["3", "4"], min: 16, max: 22, ideal: 20, strafe: 150}
    - {jahrgaenge: ["5", "6"], min: 16, max: 22, ideal: 20, strafe: 150}

sonderpaedagogik:            # IF/DaZ-Angebote kommen aus dem Kantonsprofil (skf/profile/luzern.yaml)
  is_zaehlt_als: 2           # schulinterne Festlegung: IS-Kind zählt bei der Klassengrösse doppelt
  max_is_pro_klasse: 2

zeitraster:
  tage: [Mo, Di, Mi, Do, Fr]
  halbtage:
    VM: ["08:00", "08:50", "09:55", "10:45"]
    NM: ["13:30", "14:20"]
  frei: [Mi-NM]
  blockzeiten: true          # Vormittage lückenlos (VBV § 3 Abs. 4)

faecher:
  Deutsch: {max_pro_tag: 2}
  Mathematik: {max_pro_tag: 2}
  NMG: {max_pro_tag: 2}
  Englisch: {max_pro_tag: 1}
  Französisch: {max_pro_tag: 1}
  BG: {max_pro_tag: 2}
  Musik: {max_pro_tag: 1}
  TTG: {raumtyp: TTG-Zimmer, dauer: 2}
  Bewegung und Sport: {raumtyp: Turnhalle, max_pro_tag: 1}
  Kindergarten: {raumtyp: Klassenzimmer, max_pro_tag: 6}
  Wald: {raumtyp: Klassenzimmer, max_pro_tag: 6}

# Lektionen pro Woche – vereinfachte ANNAHME; verbindlich ist die WOST 2017 (Quelle "WOST" im Profil)
stundentafel:
  KG:      {Kindergarten: 20, Bewegung und Sport: 2}
  Wald-KG: {Wald: 20}
  "1": {Deutsch: 6, Mathematik: 5, NMG: 3, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "2": {Deutsch: 6, Mathematik: 5, NMG: 4, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "3": {Deutsch: 6, Mathematik: 5, NMG: 4, Englisch: 2, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "4": {Deutsch: 5, Mathematik: 5, NMG: 5, Englisch: 2, BG: 2, TTG: 2, Musik: 2, Bewegung und Sport: 3}
  "5": {Deutsch: 5, Mathematik: 5, NMG: 5, Englisch: 2, Französisch: 3, BG: 2, TTG: 2, Musik: 1, Bewegung und Sport: 3}
  "6": {Deutsch: 5, Mathematik: 5, NMG: 5, Englisch: 2, Französisch: 3, BG: 2, TTG: 2, Musik: 1, Bewegung und Sport: 3}

# Fiktive Lehrpersonen. Pensum = [min, max] Lektionen pro Woche.
# nicht_verfuegbar: "Mi" (ganzer Tag), "Fr-NM" (Halbtag), "Mo-VM-1" (einzelne Lektion)
lehrpersonen:
  # --- Bündtmättli: Klassenlehrpersonen
  - {name: BM Lehrperson 01, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 1a}
  - {name: BM Lehrperson 02, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 1b}
  - {name: BM Lehrperson 03, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 2a}
  - {name: BM Lehrperson 04, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 2b}
  - {name: BM Lehrperson 05, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 3a}
  - {name: BM Lehrperson 06, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 3b}
  - {name: BM Lehrperson 07, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 4a}
  - {name: BM Lehrperson 08, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 4b}
  - {name: BM Lehrperson 09, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 5a}
  - {name: BM Lehrperson 10, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28], bisherige_klasse: BM 5b}
  - {name: BM Lehrperson 11, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28]}
  - {name: BM Lehrperson 12, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [22, 28]}
  - {name: BM Lehrperson 13, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [12, 16], nicht_verfuegbar: [Mo, Di]}
  - {name: BM Lehrperson 14, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Bündtmättli, pensum: [10, 14], nicht_verfuegbar: [Do, Fr]}
  - {name: BM Unterstufe Teilzeit, faecher: [Deutsch, Mathematik, NMG, Musik], jahrgaenge: ["1", "2", "3"], schulhaeuser: Bündtmättli, pensum: [8, 12], nicht_verfuegbar: [Mi, Fr]}
  # --- Eischachen: Klassenlehrpersonen
  - {name: EI Lehrperson 01, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28], bisherige_klasse: EI 1a}
  - {name: EI Lehrperson 02, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28], bisherige_klasse: EI 1b}
  - {name: EI Lehrperson 03, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28], bisherige_klasse: EI 2a}
  - {name: EI Lehrperson 04, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28], bisherige_klasse: EI 2b}
  - {name: EI Lehrperson 05, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28], bisherige_klasse: EI 3a}
  - {name: EI Lehrperson 06, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28], bisherige_klasse: EI 4a}
  - {name: EI Lehrperson 07, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28], bisherige_klasse: EI 5a}
  - {name: EI Lehrperson 08, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28]}
  - {name: EI Lehrperson 09, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [22, 28]}
  - {name: EI Lehrperson 10, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [14, 20], nicht_verfuegbar: [Mi]}
  - {name: EI Lehrperson 11, faecher: [Deutsch, Mathematik, NMG, BG, Musik, Bewegung und Sport], schulhaeuser: Eischachen, pensum: [10, 14], nicht_verfuegbar: [Mo]}
  # --- Fachlehrpersonen (teils an beiden Schulhäusern)
  - {name: Englisch BM, faecher: [Englisch], schulhaeuser: Bündtmättli, pensum: [10, 24]}
  - {name: Französisch BM, faecher: [Französisch, Englisch], schulhaeuser: Bündtmättli, pensum: [8, 24]}
  - {name: Englisch/Französisch EI, faecher: [Englisch, Französisch], schulhaeuser: Eischachen, pensum: [10, 28]}
  - {name: TTG 1, faecher: [TTG], schulhaeuser: [Bündtmättli, Eischachen], pensum: [14, 26]}
  - {name: TTG 2, faecher: [TTG], schulhaeuser: [Bündtmättli, Eischachen], pensum: [14, 26], nicht_verfuegbar: [Mi]}
  - {name: Sport Fachlehrperson, faecher: [Bewegung und Sport], schulhaeuser: [Bündtmättli, Eischachen], pensum: [0, 20]}
  # --- Schulische Heilpädagogik (IF) und DaZ
  - {name: SHP BM 1, faecher: [IF], schulhaeuser: [Bündtmättli, Im Feld], pensum: [14, 28]}
  - {name: SHP BM 2, faecher: [IF], schulhaeuser: Bündtmättli, pensum: [14, 28]}
  - {name: SHP BM 3, faecher: [IF], schulhaeuser: Bündtmättli, pensum: [10, 28], nicht_verfuegbar: [Mi]}
  - {name: SHP EI 1, faecher: [IF], schulhaeuser: Eischachen, pensum: [14, 28]}
  - {name: SHP EI 2, faecher: [IF], schulhaeuser: Eischachen, pensum: [14, 28]}
  - {name: SHP EI 3, faecher: [IF], schulhaeuser: Eischachen, pensum: [6, 20]}
  - {name: DaZ BM, faecher: [DaZ Anfang, DaZ Aufbau], schulhaeuser: [Bündtmättli, Im Feld], pensum: [10, 28]}
  - {name: DaZ EI, faecher: [DaZ Anfang, DaZ Aufbau], schulhaeuser: Eischachen, pensum: [10, 28]}
  - {name: DaZ Teilzeit, faecher: [DaZ Anfang, DaZ Aufbau], pensum: [0, 12], nicht_verfuegbar: [Mo, Di]}
  # --- Kindergarten
  - {name: KG BM 1, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Bündtmättli, pensum: [22, 24]}
  - {name: KG BM 2, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Bündtmättli, pensum: [22, 24]}
  - {name: KG BM 3, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Bündtmättli, pensum: [22, 24]}
  - {name: KG BM 4, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Bündtmättli, pensum: [22, 24]}
  - {name: KG EI 1, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Eischachen, pensum: [22, 24]}
  - {name: KG EI 2, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Eischachen, pensum: [22, 24]}
  - {name: KG EI 3, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Eischachen, pensum: [22, 24]}
  - {name: KG EI 4, faecher: [Kindergarten, Bewegung und Sport], jahrgaenge: [KG1, KG2], schulhaeuser: Eischachen, pensum: [22, 24]}
  - {name: Wald-KG Im Feld, faecher: [Wald], schulhaeuser: Im Feld, pensum: [22, 24]}

# Prognose für Ausbau-Empfehlungen: Malters wuchs 2024/25 → 2025/26 von 879 auf 911 Lernende (+3.6%)
planung:
  wachstum_prozent: 3

# Gewichte: was ist wie wichtig? (alle Gewichte: python -m skf --gewichte-anzeigen)
gewichte:
  schulweg_pro_km: 100
  klasse: 400
  lehrperson_pro_klasse: 200

# Szenarien: kleine Änderungen gegenüber der Basis. Listen mit 'name' werden pro
# Eintrag gemischt; 'entfernen: true' löscht einen Eintrag.
# Rechnen: python -m skf schule.yaml kinder.csv -s alle
szenarien:
  Kurze Schulwege:
    gewichte: {schulweg_pro_km: 400, klasse: 300}
  Umbau Eischachen:          # 2 Schulzimmer und eine Turnhalle im Schuljahr nicht nutzbar
    schulhaeuser:
      - name: Eischachen
        raeume:
          - {name: EI-Zi, anzahl: 8}
          - {name: EI-Halle, anzahl: 1}
  Geschwister zwingend:      # Geschwister immer im selben Schulhaus
    klassenbildung: {geschwister: hart}
  Lehrpersonenmangel:        # zwei Stellen unbesetzt, eine Lehrperson nur Mo–Mi
    lehrpersonen:
      - {name: BM Lehrperson 12, entfernen: true}
      - {name: EI Lehrperson 09, entfernen: true}
      - {name: BM Lehrperson 11, nicht_verfuegbar: [Do, Fr]}
