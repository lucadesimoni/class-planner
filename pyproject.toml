[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stunden-klassen-fitter"
version = "0.1.0"
description = "Klassenbildung und Stundenplan für die Volksschule mit mehreren Schulhäusern (exakte Optimierung mit OR-Tools CP-SAT)"
readme = "README.md"
license = {text = "LicenseRef-Proprietary"}
authors = [{name = "Outthinkx for Communities"}]
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = ["ortools>=9.10", "pyyaml>=6", "openpyxl>=3.1", "streamlit>=1.40", "pandas>=2"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4", "playwright>=1.40"]

[project.scripts]
skf = "skf.cli:main"

[tool.setuptools]
packages = ["skf", "skf.beispiele"]

[tool.setuptools.package-dir]
"skf.beispiele" = "beispiele"

[tool.setuptools.package-data]
skf = ["profile/*.yaml", "static/index.html", "static/leaflet/*", "static/leaflet/images/*", "static/material-symbols/*"]
"skf.beispiele" = ["malters/schule.yaml", "malters/kinder.csv", "malters/erzeuge_kinder.py", "vorlage/*"]

