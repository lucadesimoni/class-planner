[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stunden-klassen-fitter"
version = "0.1.0"
description = "Klasseneinteilung und Stundenplan für Schulen mit mehreren Schulhäusern (exakte Optimierung mit OR-Tools CP-SAT)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = ["ortools>=9.10", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
skf = "skf.cli:main"

[tool.setuptools]
packages = ["skf"]
